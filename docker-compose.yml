services:
  # Frontend
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  # Backend
  backend:
    build: ./backend
    ports:
      - "5000:3000"
    environment:
      PORT: 3000
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      CAS_LOGOUT_URL: ${CAS_LOGOUT_URL}
      LOCAL_DEV_USER: ${LOCAL_DEV_USER}
      CAS_SSO_BASE_URL: ${CAS_SSO_BASE_URL}
      CAS_SERVER_BASE_URL: ${CAS_SERVER_BASE_URL}
      CAS_VALIDATE_URL: ${CAS_VALIDATE_URL}
    depends_on:
      - database
  
  # MySql
  database:
    image: container.cs.vt.edu/anonymous/capsp26-coe-pdf-extraction-team-e-zspot/database:${IMAGE_TAG}
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${ROOT_PASSWORD}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql

  # Adminer
  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - database

volumes:
  db-data:
