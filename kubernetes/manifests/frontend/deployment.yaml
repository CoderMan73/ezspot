apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: 22012s26-ezspot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
        - name: discovery-token
      containers:
        - name: container-0
          image: container.cs.vt.edu/anonymous/capsp26-coe-pdf-extraction-team-e-zspot/frontend:${IMAGE_TAG}
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: frontend
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: false