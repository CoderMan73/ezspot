apiVersion: apps/v1
kind: Deployment
metadata:
  name: adminer
  namespace: 22012s26-ezspot
spec:
  replicas: 1
  selector:
    matchLabels:
      workload.user.cattle.io/workloadselector: apps.deployment-22012s26-ezspot-adminer
  template:
    metadata:
      labels:
        app: adminer
        workload.user.cattle.io/workloadselector: apps.deployment-22012s26-ezspot-adminer
    spec:
      containers:
        - name: container-0
          image: adminer
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: adminer
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: false