apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  namespace: 22012s26-ezspot
  annotations:
    # Allow all IPs to access
    nginx.ingress.kubernetes.io/whitelist-source-range: "0.0.0.0/0,::/0"
spec:
  rules:
    - host: 22012s26-ezspot.discovery.cs.vt.edu
      http:
        paths:
          # / -> frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
          # /api -> backend
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 3000
          # /db -> adminer
          - path: /db
            pathType: Prefix
            backend:
              service:
                name: adminer
                port:
                  number: 8080